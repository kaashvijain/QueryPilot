services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querypilot-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    volumes:
      - querypilot-uploads:/app/uploads
      - querypilot-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - querypilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8001
    container_name: querypilot-frontend
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - querypilot-network

volumes:
  querypilot-uploads:
    driver: local
  querypilot-data:
    driver: local

networks:
  querypilot-network:
    driver: bridge
